<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css" id="theme-light">
  <link rel="stylesheet" href="../assets/css/theme-dark.css" id="theme-dark" disabled>
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/music.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <header-bar></header-bar>
  <main class="music-container">
    <div class="music-layout">
      <!-- Sidebar: Playlist -->
      <aside class="playlist-panel">
        <h2>📋 Playlist</h2>
        <div class="playlist-controls">
          <button id="addLocalBtn">📁 Thêm nhạc</button>
          <button id="addUrlBtn">🔗 Thêm URL</button>
          <input type="file" id="fileInput" accept="audio/*" multiple hidden>
        </div>
        <ul class="playlist" id="playlist"></ul>
      </aside>

      <!-- Main: Now Playing -->
      <section class="player-panel">
        <div class="album-art" id="albumArt">
          <div class="art-placeholder">🎵</div>
        </div>
        <div class="track-info">
          <h2 id="trackTitle">Chưa chọn bài</h2>
          <p id="trackArtist">Nghệ sĩ</p>
        </div>
        <div class="progress-bar">
          <span id="currentTime">0:00</span>
          <input type="range" id="seekBar" value="0" min="0" max="100">
          <span id="duration">0:00</span>
        </div>
        <div class="player-controls">
          <button id="shuffleBtn">🔀</button>
          <button id="prevBtn">⏮️</button>
          <button id="playBtn">▶️</button>
          <button id="nextBtn">⏭️</button>
          <button id="repeatBtn">🔁</button>
        </div>
        <div class="volume-bar">
          <span>🔊</span>
          <input type="range" id="volumeBar" value="80" min="0" max="100">
        </div>
        <!-- Visualizer -->
        <canvas id="visualizer" width="400" height="100"></canvas>
      </section>
    </div>
  </main>
  <music-mini></music-mini>
  <back-button></back-button>
  <script type="module" src="../assets/js/components/header-bar.js"></script>
  <script type="module" src="../assets/js/components/back-button.js"></script>
  <script type="module" src="../assets/js/components/music-mini.js"></script>
  <script type="module" src="../assets/js/pages/music.js"></script>
</body>
</html>
