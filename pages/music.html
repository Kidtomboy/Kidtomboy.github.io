<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;d.setAttribute('data-theme',localStorage.getItem('theme')||'dark');d.setAttribute('data-accent',localStorage.getItem('accent')||'green');if(localStorage.getItem('fx')==='off')d.setAttribute('data-fx','off');var f=localStorage.getItem('fsize');if(f)d.style.fontSize=f+'%'}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trình phát nhạc với playlist và visualizer.">
  <meta name="theme-color" content="#05080a">
  <meta property="og:title" content="Nhạc · Kidtomboy"><meta property="og:description" content="Trình phát nhạc với playlist và visualizer."><meta property="og:type" content="website"><meta property="og:image" content="https://kidtomboy.github.io/assets/og.svg">
  <title>Nhạc · Kidtomboy</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&subset=vietnamese&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <main class="music-container">
    <h1 class="page-title">🎵 Nhạc</h1>
    <p class="page-sub">Thêm file nhạc từ máy hoặc dán đường dẫn URL.</p>
    <div class="music-layout">
      <aside class="playlist-panel">
        <h2>📋 Playlist</h2>
        <div class="playlist-controls">
          <button id="addLocalBtn">📁 Thêm nhạc</button>
          <button id="addUrlBtn">🔗 Thêm URL</button>
          <input type="file" id="fileInput" accept="audio/*" multiple hidden>
        </div>
        <ul class="playlist" id="playlist"></ul>
      </aside>
      <section class="player-panel">
        <div class="album-art" id="albumArt"><div class="art-placeholder">🎵</div></div>
        <div class="track-info"><h2 id="trackTitle">Chưa chọn bài</h2><p id="trackArtist">Nghệ sĩ</p></div>
        <div class="progress-bar"><span id="currentTime">0:00</span><input type="range" id="seekBar" value="0" min="0" max="100" aria-label="Tua"><span id="duration">0:00</span></div>
        <div class="player-controls">
          <button id="shuffleBtn" aria-label="Ngẫu nhiên">🔀</button><button id="prevBtn" aria-label="Bài trước">⏮️</button>
          <button id="playBtn" aria-label="Phát">▶️</button><button id="nextBtn" aria-label="Bài sau">⏭️</button>
          <button id="repeatBtn" aria-label="Lặp">🔁</button>
        </div>
        <div class="volume-bar"><span>🔊</span><input type="range" id="volumeBar" value="80" min="0" max="100" aria-label="Âm lượng"></div>
        <canvas id="visualizer" width="400" height="100"></canvas>
      </section>
    </div>
  </main>
  <script type="module" src="../assets/js/components/shell.js"></script>
  <script type="module" src="../assets/js/pages/music.js"></script>
</body>
</html>
