<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Một ô tìm kiếm cho nhiều công cụ, kèm bookmark.">
  <meta name="theme-color" content="#05080a">
  <title>Tìm kiếm · Kidtomboy</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&subset=vietnamese&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <main class="search-container">
    <h1 class="page-title" style="text-align:center">🔍 Tìm kiếm</h1>
    <div class="search-engine-selector">
      <button data-engine="google" class="active">Google</button>
      <button data-engine="duckduckgo">DuckDuckGo</button>
      <button data-engine="bing">Bing</button>
      <button data-engine="yahoo">Yahoo</button>
      <button data-engine="brave">Brave</button>
      <button data-engine="yandex">Yandex</button>
      <button data-engine="ecosia">Ecosia</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Nhập từ khóa…" autofocus aria-label="Từ khóa">
      <button id="search-btn" aria-label="Tìm">🔍</button>
    </div>
    <div class="bookmarks" id="bookmarks-container"></div>
    <div id="settings-panel" hidden></div>
  </main>
  <script type="module" src="../assets/js/components/shell.js"></script>
  <script type="module" src="../assets/js/pages/search.js"></script>
</body>
</html>
