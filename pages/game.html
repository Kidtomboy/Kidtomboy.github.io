<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;d.setAttribute('data-theme',localStorage.getItem('theme')||'dark');d.setAttribute('data-accent',localStorage.getItem('accent')||'green');if(localStorage.getItem('fx')==='off')d.setAttribute('data-fx','off');var f=localStorage.getItem('fsize');if(f)d.style.fontSize=f+'%'}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bộ sưu tập game chơi ngay trên trình duyệt.">
  <meta name="theme-color" content="#05080a">
  <meta property="og:title" content="Game · Kidtomboy"><meta property="og:description" content="Bộ sưu tập game chơi ngay trên trình duyệt."><meta property="og:type" content="website"><meta property="og:image" content="https://kidtomboy.github.io/assets/og.svg">
  <title>Game · Kidtomboy</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&subset=vietnamese&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <main class="game-hub">
    <h1 class="page-title">🎮 Bộ sưu tập game</h1>
    <p class="page-sub">Chơi ngay trên trình duyệt, điểm cao nhất được lưu trên máy bạn.</p>
    <div class="controls-row">
      <input type="search" id="game-filter" placeholder="Lọc game…" aria-label="Lọc game">
      <label class="muted">Sắp xếp <select id="game-sort" aria-label="Sắp xếp game">
        <option value="cat">Theo nhóm</option><option value="custom">Tự sắp xếp</option><option value="az">A → Z</option><option value="plays">Chơi nhiều nhất</option><option value="recent">Chơi gần nhất</option><option value="fav">Yêu thích trước</option></select></label>
      <button class="btn ghost" id="game-reset" type="button" hidden>↺ Đặt lại thứ tự</button>
      <button class="btn ghost" id="game-rand" type="button">🎲 Ngẫu nhiên</button>
      <span class="muted" id="game-count"></span>
    </div>
    <div id="personal"></div>
    <div id="game-list"></div>
  </main>
  <script type="module" src="../assets/js/components/shell.js"></script>
  <script type="module" src="../assets/js/pages/game-hub.js"></script>
</body>
</html>
