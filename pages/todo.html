<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css" id="theme-light">
  <link rel="stylesheet" href="../assets/css/theme-dark.css" id="theme-dark" disabled>
  <link rel="stylesheet" href="../assets/css/todo.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <header-bar></header-bar>
  <main class="todo-container">
    <h1>✅ Việc cần làm</h1>
    <div class="todo-controls">
      <input type="text" id="taskInput" placeholder="Thêm công việc mới...">
      <select id="prioritySelect">
        <option value="low">Thấp</option>
        <option value="medium" selected>Trung bình</option>
        <option value="high">Cao</option>
      </select>
      <input type="date" id="deadlineInput">
      <input type="text" id="tagInput" placeholder="Tag (cách nhau dấu phẩy)">
      <button id="addTaskBtn">➕ Thêm</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Tất cả</button>
      <button class="filter-btn" data-filter="active">Đang làm</button>
      <button class="filter-btn" data-filter="completed">Hoàn thành</button>
      <button class="filter-btn" data-filter="archived">Lưu trữ</button>
      <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm...">
      <button id="exportBtn">📤 Export</button>
      <button id="importBtn">📥 Import</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </main>
  <back-button></back-button>
  <script type="module" src="../assets/js/components/header-bar.js"></script>
  <script type="module" src="../assets/js/components/back-button.js"></script>
  <script type="module" src="../assets/js/pages/todo.js"></script>
</body>
</html>
