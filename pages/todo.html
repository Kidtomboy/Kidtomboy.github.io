<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;d.setAttribute('data-theme',localStorage.getItem('theme')||'dark');d.setAttribute('data-accent',localStorage.getItem('accent')||'green');if(localStorage.getItem('fx')==='off')d.setAttribute('data-fx','off');var f=localStorage.getItem('fsize');if(f)d.style.fontSize=f+'%'}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Danh sách việc cần làm, lưu ngay trên máy bạn.">
  <meta name="theme-color" content="#05080a">
  <meta property="og:title" content="Việc cần làm · Kidtomboy"><meta property="og:description" content="Danh sách việc cần làm, lưu ngay trên máy bạn."><meta property="og:type" content="website"><meta property="og:image" content="https://kidtomboy.github.io/assets/og.svg">
  <title>Việc cần làm · Kidtomboy</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&subset=vietnamese&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <main class="todo-container">
    <h1 class="page-title">✅ Việc cần làm</h1>
    <p class="page-sub">Dữ liệu lưu trong trình duyệt của bạn, không gửi đi đâu.</p>
    <div class="todo-controls">
      <input type="text" id="taskInput" placeholder="Thêm công việc mới…" aria-label="Công việc">
      <select id="prioritySelect" aria-label="Mức ưu tiên">
        <option value="low">Thấp</option><option value="medium" selected>Trung bình</option><option value="high">Cao</option>
      </select>
      <input type="date" id="deadlineInput" aria-label="Hạn">
      <input type="text" id="tagInput" placeholder="Tag (cách nhau dấu phẩy)" aria-label="Tag">
      <button id="addTaskBtn">➕ Thêm</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Tất cả</button>
      <button class="filter-btn" data-filter="active">Đang làm</button>
      <button class="filter-btn" data-filter="completed">Hoàn thành</button>
      <button class="filter-btn" data-filter="archived">Lưu trữ</button>
      <input type="text" id="searchInput" placeholder="🔍 Tìm…" aria-label="Tìm việc">
      <button id="exportBtn">📤 Export</button>
      <button id="importBtn">📥 Import</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </main>
  <script type="module" src="../assets/js/components/shell.js"></script>
  <script type="module" src="../assets/js/pages/todo.js"></script>
</body>
</html>
