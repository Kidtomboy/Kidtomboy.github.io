<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;d.setAttribute('data-theme',localStorage.getItem('theme')||'dark');d.setAttribute('data-accent',localStorage.getItem('accent')||'green');if(localStorage.getItem('fx')==='off')d.setAttribute('data-fx','off');var f=localStorage.getItem('fsize');if(f)d.style.fontSize=f+'%'}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Math Quiz"><meta property="og:description" content="Kidtomboy"><meta property="og:type" content="website"><meta property="og:image" content="https://kidtomboy.github.io/assets/og.svg">
  <title>Math Quiz</title>
  <style>
    .game-wrapper {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 0;
    }
    .settings {
      display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .settings select {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--card-bg); color: var(--text-primary);
      font-size: 1rem;
    }
    .quiz-card {
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: var(--radius-lg);
      padding: 2rem 3rem;
      text-align: center;
      margin: 1rem 0;
      min-width: 300px;
    }
    .question {
      font-size: 3rem; font-weight: bold; margin: 1rem 0;
    }
    .answer-input {
      font-size: 2rem; padding: 0.5rem 1rem; width: 150px;
      text-align: center; border-radius: var(--radius-sm);
      border: 2px solid var(--card-border);
      background: var(--bg-primary); color: var(--text-primary);
    }
    .timer {
      font-size: 1.5rem; color: var(--accent); margin: 0.5rem 0;
    }
    .game-ui {
      display: flex; gap: 2rem; margin-bottom: 1rem; font-size: 1.1rem;
    }
    .controls {
      margin-top: 1rem; display: flex; gap: 1rem;
    }
    button {
      padding: 0.8rem 2rem; border-radius: 2rem;
      border: none; background: var(--accent); color: white;
      font-weight: bold; cursor: pointer;
    }
  </style>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&subset=vietnamese&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper" role="main">
    <h1>📐 Math Quiz</h1>
    <div class="settings">
      <select id="operationSelect" aria-label="Phép tính">
        <option value="all">Tất cả</option>
        <option value="add">Cộng</option>
        <option value="sub">Trừ</option>
        <option value="mul">Nhân</option>
        <option value="div">Chia</option>
      </select>
      <select id="difficultySelect" aria-label="Độ khó">
        <option value="easy">Dễ (1-20)</option>
        <option value="medium" selected>Trung bình (1-100)</option>
        <option value="hard">Khó (1-1000)</option>
      </select>
    </div>
    <div class="game-ui">
      <span>Điểm: <span id="score">0</span></span>
      <span>Best: <span id="best">0</span></span>
      <span>Câu đúng: <span id="correct">0</span></span>
    </div>
    <div class="quiz-card">
      <div class="timer" id="timer">⏱️ 15s</div>
      <div class="question" id="question">5 + 3 = ?</div>
      <input type="number" class="answer-input" id="answerInput" autofocus aria-label="Đáp án">
      <p style="margin-top:0.5rem;">Nhấn Enter để trả lời</p>
    </div>
    <div class="controls">
      <button id="restartBtn">🔄 Chơi lại</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/educational/math-quiz.js"></script>
  <script type="module" src="../assets/js/components/shell.js"></script>
</body>
</html>
