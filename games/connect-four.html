<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;d.setAttribute('data-theme',localStorage.getItem('theme')||'dark');d.setAttribute('data-accent',localStorage.getItem('accent')||'green');if(localStorage.getItem('fx')==='off')d.setAttribute('data-fx','off');var f=localStorage.getItem('fsize');if(f)d.style.fontSize=f+'%'}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Connect Four"><meta property="og:description" content="Kidtomboy"><meta property="og:type" content="website"><meta property="og:image" content="https://kidtomboy.github.io/assets/og.svg">
  <title>Connect Four</title>
  <style>
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
    }
    .settings {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      align-items: center;
    }
    .settings select, .settings button {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 1rem;
    }
    .game-ui {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      flex-wrap: wrap;
    }
    .status {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      min-height: 2rem;
    }
    .board {
      background: #1a6dff;
      padding: 10px;
      border-radius: var(--radius-lg);
      display: inline-block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 60px);
      grid-template-rows: repeat(6, 60px);
      gap: 6px;
    }
    .cell {
      background: var(--bg-primary);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      position: relative;
    }
    .cell.red::after, .cell.yellow::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px;
      width: 52px; height: 52px;
      border-radius: 50%;
    }
    .cell.red::after {
      background: #e74c3c;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3);
    }
    .cell.yellow::after {
      background: #f1c40f;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3);
    }
    .column-buttons {
      display: grid;
      grid-template-columns: repeat(7, 60px);
      gap: 6px;
      margin-bottom: 10px;
    }
    .col-btn {
      height: 40px;
      border-radius: var(--radius-sm);
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background var(--transition-speed);
    }
    .col-btn:hover {
      background: rgba(255,255,255,0.4);
    }
    .col-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }
      @media (max-width: 480px) { .board { zoom: 0.7; } }
  </style>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&subset=vietnamese&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper" role="main">
    <h1>🔴 Connect Four</h1>
    <div class="settings">
      <select id="modeSelect" aria-label="Chế độ chơi">
        <option value="pvp">2 Người</option>
        <option value="ai" selected>Đấu Máy</option>
      </select>
      <select id="difficultySelect" aria-label="Độ khó">
        <option value="easy">Dễ</option>
        <option value="medium" selected>Trung bình</option>
        <option value="hard">Khó</option>
      </select>
    </div>
    <div class="game-ui">
      <span>Người: <span id="player">🔴</span></span>
      <span>Thắng: <span id="wins">0</span></span>
      <span>Hòa: <span id="draws">0</span></span>
      <span>AI: <span id="aiWins">0</span></span>
    </div>
    <div class="status" id="status">Lượt của bạn (🔴)</div>
    <div class="board">
      <div class="column-buttons" id="columnButtons"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="controls">
      <button id="newGameBtn">🔄 Ván mới</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/board/connect-four.js"></script>
  <script type="module" src="../assets/js/components/shell.js"></script>
</body>
</html>
