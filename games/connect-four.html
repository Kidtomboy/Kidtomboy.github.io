<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Four</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css" id="theme-light">
  <link rel="stylesheet" href="../assets/css/theme-dark.css" id="theme-dark" disabled>
  <link rel="stylesheet" href="../assets/css/game-common.css">
  <style>
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 80px;
    }
    .settings {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      align-items: center;
    }
    .settings select, .settings button {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 1rem;
    }
    .game-ui {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      flex-wrap: wrap;
    }
    .status {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      min-height: 2rem;
    }
    .board {
      background: #1a6dff;
      padding: 10px;
      border-radius: var(--radius-lg);
      display: inline-block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 60px);
      grid-template-rows: repeat(6, 60px);
      gap: 6px;
    }
    .cell {
      background: var(--bg-primary);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      position: relative;
    }
    .cell.red::after, .cell.yellow::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px;
      width: 52px; height: 52px;
      border-radius: 50%;
    }
    .cell.red::after {
      background: #e74c3c;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3);
    }
    .cell.yellow::after {
      background: #f1c40f;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3);
    }
    .column-buttons {
      display: grid;
      grid-template-columns: repeat(7, 60px);
      gap: 6px;
      margin-bottom: 10px;
    }
    .col-btn {
      height: 40px;
      border-radius: var(--radius-sm);
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background var(--transition-speed);
    }
    .col-btn:hover {
      background: rgba(255,255,255,0.4);
    }
    .col-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }
  </style>
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper">
    <h1>🔴 Connect Four</h1>
    <div class="settings">
      <select id="modeSelect">
        <option value="pvp">2 Người</option>
        <option value="ai" selected>Đấu Máy</option>
      </select>
      <select id="difficultySelect">
        <option value="easy">Dễ</option>
        <option value="medium" selected>Trung bình</option>
        <option value="hard">Khó</option>
      </select>
    </div>
    <div class="game-ui">
      <span>Người: <span id="player">🔴</span></span>
      <span>Thắng: <span id="wins">0</span></span>
      <span>Hòa: <span id="draws">0</span></span>
      <span>AI: <span id="aiWins">0</span></span>
    </div>
    <div class="status" id="status">Lượt của bạn (🔴)</div>
    <div class="board">
      <div class="column-buttons" id="columnButtons"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="controls">
      <button id="newGameBtn">🔄 Ván mới</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/board/connect-four.js"></script>
</body>
</html>
