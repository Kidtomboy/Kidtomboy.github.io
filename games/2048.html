<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css" id="theme-light">
  <link rel="stylesheet" href="../assets/css/theme-dark.css" id="theme-dark" disabled>
  <link rel="stylesheet" href="../assets/css/game-common.css">
  <style>
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 80px;
    }
    .settings {
      margin-bottom: 1rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .settings select {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 1rem;
    }
    .game-ui {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      flex-wrap: wrap;
    }
    .board {
      display: grid;
      gap: 10px;
      background: var(--card-border);
      padding: 10px;
      border-radius: var(--radius-md);
      position: relative;
      width: min(90vw, 400px);
      aspect-ratio: 1 / 1;
    }
    .tile {
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 2rem;
      transition: all 0.15s ease;
      position: relative;
    }
    .tile[data-value="2"] { background: #eee4da; color: #776e65; }
    .tile[data-value="4"] { background: #ede0c8; color: #776e65; }
    .tile[data-value="8"] { background: #f2b179; color: #f9f6f2; }
    .tile[data-value="16"] { background: #f59563; color: #f9f6f2; }
    .tile[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
    .tile[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
    .tile[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 1.8rem; }
    .tile[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 1.8rem; }
    .tile[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 1.8rem; }
    .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 1.5rem; }
    .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 1.5rem; }
    .tile[data-value="4096"] { background: #f59563; color: #f9f6f2; font-size: 1.4rem; }
    .tile[data-value="8192"] { background: #f67c5f; color: #f9f6f2; font-size: 1.4rem; }
    .tile.ghost {
      opacity: 0.4;
      border: 2px dashed var(--text-secondary);
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: var(--radius-md);
      z-index: 10;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
    }
    .overlay button {
      margin-top: 1rem;
      padding: 0.8rem 2rem;
      border-radius: 2rem;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }
  </style>
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper">
    <h1>🔢 2048</h1>
    <div class="settings">
      <label for="sizeSelect">Kích thước:</label>
      <select id="sizeSelect">
        <option value="4" selected>4x4</option>
        <option value="5">5x5</option>
        <option value="6">6x6</option>
      </select>
    </div>
    <div class="game-ui">
      <span>Điểm: <span id="score">0</span></span>
      <span>Best: <span id="best">0</span></span>
      <span>Nước đi: <span id="moves">0</span></span>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button id="pauseBtn">⏸️ Tạm dừng</button>
      <button id="restartBtn">🔄 Chơi lại</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/puzzle/2048.js"></script>
</body>
</html>
