<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css" id="theme-light">
  <link rel="stylesheet" href="../assets/css/theme-dark.css" id="theme-dark" disabled>
  <link rel="stylesheet" href="../assets/css/game-common.css">
  <style>
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 80px;
    }
    .game-area {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }
    #gameCanvas {
      border: 2px solid var(--accent);
      border-radius: var(--radius-md);
      background: #111;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 130px;
    }
    .next-piece h3, .queue-piece h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      text-align: center;
    }
    @media (max-width: 600px) {
      .game-area { flex-direction: column; align-items: center; }
    }
  </style>
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper">
    <h1>🧱 Tetris</h1>
    <div class="game-ui">
      <span>Điểm: <span id="score">0</span></span>
      <span>Dòng: <span id="lines">0</span></span>
      <span>Best: <span id="best">0</span></span>
      <span>Tốc độ: <span id="speedDisplay">1000ms</span></span>
    </div>
    <div class="game-area">
      <canvas id="gameCanvas" width="300" height="600"></canvas>
      <div class="side-panel">
        <div class="next-piece">
          <h3>Tiếp theo</h3>
          <canvas id="nextCanvas" width="120" height="120"></canvas>
        </div>
        <div class="queue-piece" id="queueContainer" style="display:none;">
          <h3>Hàng chờ</h3>
          <div id="queueCanvases"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="pauseBtn">⏸️ Tạm dừng</button>
      <button id="restartBtn">🔄 Chơi lại</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/arcade/tetris.js"></script>
</body>
</html>
