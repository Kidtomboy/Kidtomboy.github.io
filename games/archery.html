<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;d.setAttribute('data-theme',localStorage.getItem('theme')||'dark');d.setAttribute('data-accent',localStorage.getItem('accent')||'green');if(localStorage.getItem('fx')==='off')d.setAttribute('data-fx','off');var f=localStorage.getItem('fsize');if(f)d.style.fontSize=f+'%'}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta property="og:title" content="Archery"><meta property="og:description" content="Kidtomboy"><meta property="og:type" content="website"><meta property="og:image" content="https://kidtomboy.github.io/assets/og.svg">
  <title>Archery</title>
  <style>
    .game-wrapper {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 0;
    }
    .archery-container {
      display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
      justify-content: center;
    }
    canvas {
      border: 2px solid var(--accent);
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
      cursor: crosshair;
    }
    .hud {
      display: flex; flex-direction: column; gap: 0.8rem;
      min-width: 150px;
      padding: 1rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
    }
    .hud-section h3 { margin: 0 0 0.3rem; font-size: 0.9rem; }
    .power-bar {
      width: 30px; height: 200px;
      background: var(--bg-tertiary);
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }
    .power-fill {
      position: absolute; bottom: 0; width: 100%;
      background: linear-gradient(to top, #e74c3c, #f1c40f, #2ecc71);
      border-radius: 15px;
      transition: height 0.05s;
    }
    .wind-indicator {
      font-size: 1.2rem; font-weight: bold;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .controls {
      margin-top: 1rem; display: flex; gap: 1rem;
    }
    button {
      padding: 0.8rem 1.5rem; border-radius: 2rem;
      border: none; background: var(--accent); color: white;
      font-weight: bold; cursor: pointer;
    }
  </style>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&subset=vietnamese&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper" role="main">
    <h1>🏹 Archery</h1>
    <div class="archery-container">
      <canvas id="archeryCanvas" width="700" height="400"></canvas>
      <div class="hud">
        <div class="hud-section">
          <h3>Điểm: <span id="scoreDisplay">0</span></h3>
          <h3>Best: <span id="bestDisplay">0</span></h3>
        </div>
        <div class="hud-section">
          <h3>Lực</h3>
          <div class="power-bar"><div class="power-fill" id="powerFill" style="height:0%"></div></div>
          <span id="powerText">0%</span>
        </div>
        <div class="hud-section">
          <h3>Gió</h3>
          <div class="wind-indicator" id="windDisplay">➡️ 0</div>
        </div>
        <div class="hud-section">
          <h3>Mũi tên: <span id="arrowsLeft">∞</span></h3>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="newGameBtn">🔄 Ván mới</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/sports/archery.js"></script>
  <script type="module" src="../assets/js/components/shell.js"></script>
</body>
</html>
