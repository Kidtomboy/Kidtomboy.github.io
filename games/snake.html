<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
    }
    canvas {
      border: 2px solid var(--accent);
      border-radius: var(--radius-md);
    }
    .game-ui {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
  </style>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper">
    <h1>🐍 Snake</h1>
    <div class="game-ui">
      <span>Điểm: <span id="score">0</span></span>
      <span>Best: <span id="best">0</span></span>
      <span>Tốc độ: <span id="speedDisplay">100ms</span></span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
      <button id="pauseBtn">⏸️ Tạm dừng</button>
      <button id="restartBtn">🔄 Chơi lại</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/arcade/snake.js"></script>
  <script type="module" src="../assets/js/components/shell.js"></script>
</body>
</html>
