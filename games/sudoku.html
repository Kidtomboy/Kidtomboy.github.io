<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudoku</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css" id="theme-light">
  <link rel="stylesheet" href="../assets/css/theme-dark.css" id="theme-dark" disabled>
  <link rel="stylesheet" href="../assets/css/game-common.css">
  <style>
    .game-wrapper {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 80px;
    }
    .settings {
      display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap;
    }
    .settings select, .settings button {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--card-bg); color: var(--text-primary);
      font-size: 1rem;
    }
    .game-ui {
      display: flex; gap: 1.5rem; margin-bottom: 0.5rem; font-size: 1.1rem;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 44px);
      grid-template-rows: repeat(9, 44px);
      border: 3px solid var(--text-primary);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin: 1rem 0;
      position: relative;
    }
    .cell {
      border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: bold;
      cursor: pointer; user-select: none;
      background: var(--bg-primary);
      transition: background 0.2s;
      position: relative;
    }
    .cell.given { background: var(--bg-secondary); color: var(--text-primary); }
    .cell.user { color: var(--accent); }
    .cell.error { background: #e74c3c33; }
    .cell.selected { box-shadow: inset 0 0 0 3px var(--accent); }
    .cell:nth-child(9n+3), .cell:nth-child(9n+6) { border-right-width: 3px; }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) { border-bottom-width: 3px; }
    .forbidden-nums {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 0.5rem; color: #e74c3c; opacity: 0.7;
      display: flex; flex-wrap: wrap; gap: 1px;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: var(--radius-md); z-index: 10;
      color: white; font-size: 2rem; font-weight: bold;
    }
    .overlay button {
      margin-top: 1rem; padding: 0.8rem 2rem; border-radius: 2rem;
      border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer;
    }
    .controls {
      margin-top: 0.5rem; display: flex; gap: 1rem;
    }
    .number-pad {
      display: flex; gap: 4px; margin-top: 0.5rem; flex-wrap: wrap; justify-content: center;
    }
    .number-pad button {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      border: 2px solid var(--card-border); background: var(--card-bg);
      font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: all 0.2s;
    }
    .number-pad button:hover { background: var(--accent); color: white; }
    .status { font-size: 1.1rem; margin-bottom: 0.5rem; min-height: 1.5rem; }
  </style>
  <script type="module" src="../assets/js/core/theme.js"></script>
</head>
<body>
  <div class="game-wrapper">
    <h1>🧩 Sudoku</h1>
    <div class="settings">
      <select id="difficultySelect">
        <option value="easy">Dễ (nhiều gợi ý)</option>
        <option value="medium" selected>Trung bình</option>
        <option value="hard">Khó (ít gợi ý)</option>
      </select>
    </div>
    <div class="game-ui">
      <span>❤️ Mạng: <span id="lives">5</span></span>
      <span>⏱️ Thời gian: <span id="timer">0</span>s</span>
    </div>
    <div class="status" id="status">Chọn ô và nhập số</div>
    <div id="boardContainer" style="position:relative;">
      <div class="board" id="board"></div>
    </div>
    <div class="number-pad" id="numberPad"></div>
    <div class="controls">
      <button id="restartBtn">🔄 Ván mới</button>
      <button id="fullscreenBtn">⛶ Toàn màn</button>
    </div>
  </div>
  <script type="module" src="../assets/js/games/puzzle/sudoku.js"></script>
</body>
</html>
